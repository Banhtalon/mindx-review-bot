name: bootstrap-browser-state-local

on:
  workflow_dispatch:
    inputs:
      workspace_id:
        description: Workspace UUID for the Teaching browser state
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    # This label is assigned only to the one-time runner on the Owner's PC.
    runs-on: [self-hosted, windows, x64, mindx-bootstrap-local]
    timeout-minutes: 15
    env:
      MINDX_STATE_PATH: C:\Users\QQ\AppData\Local\Temp\mindx-teaching-state-refresh-20260929.json
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BROWSER_STATE_ENCRYPTION_KEY: ${{ secrets.BROWSER_STATE_ENCRYPTION_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"

      - name: Install Python
        shell: pwsh
        run: uv python install 3.12

      - name: Install locked runner
        shell: pwsh
        run: uv sync --locked --project apps/browser-runner

      - name: Upload encrypted Teaching state
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:MINDX_STATE_PATH -PathType Leaf)) {
            throw "STORAGE_STATE_INVALID"
          }
          uv run --project apps/browser-runner mindx-runner bootstrap-browser-state `
            --site teaching `
            --workspace-id "${{ inputs.workspace_id }}" `
            --state-path "$env:MINDX_STATE_PATH" `
            --key-version 1

      - name: Remove local state file
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath $env:MINDX_STATE_PATH -Force -ErrorAction SilentlyContinue
