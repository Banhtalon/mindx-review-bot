name: spike0-dispatch-probe
run-name: spike0 synthetic ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Synthetic automation job UUID
        required: true
        type: string
      job_type:
        description: Synthetic read-only job type
        required: true
        type: choice
        options:
          - sync_teaching
          - read_lms_pending
      recover_from_run:
        description: Optional pinned failure before worker claim (37578920147 only)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: mindx-spike0-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate synthetic dispatch input
        env:
          JOB_ID: ${{ inputs.job_id }}
          JOB_TYPE: ${{ inputs.job_type }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import sys

          job_id = os.environ["JOB_ID"]
          job_type = os.environ["JOB_TYPE"]
          uuid_pattern = (
              r"[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-"
              r"[89ab][0-9a-f]{3}-[0-9a-f]{12}"
          )

          if re.fullmatch(uuid_pattern, job_id) is None:
              print("invalid synthetic job id", file=sys.stderr)
              sys.exit(1)
          if job_type not in {"sync_teaching", "read_lms_pending"}:
              print("invalid synthetic job type", file=sys.stderr)
              sys.exit(1)

          print("Spike 0 dispatch probe accepted", job_id, job_type)
          PY

  runtime:
    needs: validate
    if: github.repository == 'Banhtalon/mindx-review-bot' && github.workflow_ref == 'Banhtalon/mindx-review-bot/.github/workflows/spike0-dispatch-probe.yml@refs/heads/main' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && vars.MINDX_API_CHAIN_PILOT_APPROVAL_SHA == github.sha && inputs.job_id == '01a92fbb-6c31-5c39-b958-04b8a092472c' && inputs.job_type == 'sync_teaching' && inputs.recover_from_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout approved source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"

      - name: Install the locked Python runner
        run: |
          uv python install 3.12
          uv sync --locked --project apps/browser-runner

      - name: Verify exact fixed-job dispatch history
        env:
          RECOVER_FROM_RUN: ${{ inputs.recover_from_run }}
          MINDX_API_CHAIN_PILOT_APPROVAL_SHA: ${{ vars.MINDX_API_CHAIN_PILOT_APPROVAL_SHA }}
          GITHUB_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
          JOB_TYPE: ${{ inputs.job_type }}
        run: >-
          uv run --project apps/browser-runner python scripts/api_chain_synthetic_pilot.py
          --preflight --receipt .workflow-local/api-chain-synthetic/receipt.json
          --recover-from-run "$RECOVER_FROM_RUN"

      - name: Run one fixed synthetic API lease chain
        env:
          MINDX_API_CHAIN_PILOT_APPROVAL_SHA: ${{ vars.MINDX_API_CHAIN_PILOT_APPROVAL_SHA }}
          JOB_ID: ${{ inputs.job_id }}
          JOB_TYPE: ${{ inputs.job_type }}
          SUPABASE_URL: https://gnvzjvgfsxfjgldatbwt.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          chromium="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chromium" || { echo "PILOT_CHROMIUM_REQUIRED"; exit 1; }
          uv run --project apps/browser-runner python scripts/api_chain_synthetic_pilot.py \
            --run --receipt .workflow-local/api-chain-synthetic/receipt.json --chromium "$chromium"

      - name: Preserve the safe attempted-operation receipt
        if: always()
        run: |
          receipt=".workflow-local/api-chain-synthetic/receipt.json"
          if [ -f "$receipt" ]; then
            echo '### Synthetic API-chain receipt' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'PILOT_RECEIPT_MISSING: reconcile before any further attempt.' >> "$GITHUB_STEP_SUMMARY"
          fi
