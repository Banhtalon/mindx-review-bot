name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"

      - name: Install Python
        run: uv python install 3.12

      - name: Install Node dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint

      - name: Typecheck web
        run: npm run typecheck

      - name: Test web
        run: npm run test

      - name: Build web
        run: npm run build

      - name: Verify no secrets
        run: npm run verify:no-secrets

      - name: Verify no live write
        run: npm run verify:no-live-write

      - name: Start local Supabase
        run: npx supabase start

      - name: Reset local Supabase schema
        run: npx supabase db reset

      - name: Test local Supabase RLS
        run: npm run test:rls

      - name: Install locked browser-runner
        run: uv sync --locked --project apps/browser-runner

      - name: Ruff browser-runner
        working-directory: apps/browser-runner
        run: uv run ruff check .

      - name: Mypy browser-runner
        working-directory: apps/browser-runner
        run: uv run mypy src

      - name: Pytest browser-runner
        working-directory: apps/browser-runner
        run: uv run pytest
