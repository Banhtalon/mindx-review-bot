name: runtime-synthetic-pilot

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mindx-runtime-synthetic-20261006
  cancel-in-progress: false

jobs:
  runtime:
    # First dispatch only; Lead sets approval after Owner authorizes this exact main.
    if: github.repository == 'Banhtalon/mindx-review-bot' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.run_number == 1 && vars.MINDX_RUNTIME_PILOT_APPROVAL_SHA == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked runner libraries
        run: uv sync --locked --project apps/browser-runner

      - name: Verify exact approval and complete first-dispatch history
        env:
          MINDX_RUNTIME_PILOT_APPROVAL_SHA: ${{ vars.MINDX_RUNTIME_PILOT_APPROVAL_SHA }}
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --project apps/browser-runner python scripts/runtime_synthetic_pilot.py --preflight --receipt .workflow-local/runtime-cloud/receipt.json

      - name: Run three real processes with fixed synthetic scope
        env:
          ANONYMIZED_TELEMETRY: "false"
          MINDX_RUNTIME_PILOT_APPROVAL_SHA: ${{ vars.MINDX_RUNTIME_PILOT_APPROVAL_SHA }}
        run: |
          chrome_path="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_path" || { echo "RUNTIME_CHROMIUM_REQUIRED"; exit 1; }
          uv run --project apps/browser-runner python scripts/runtime_synthetic_pilot.py --cloud --receipt .workflow-local/runtime-cloud/receipt.json --chromium "$chrome_path"

      - name: Preserve safe receipt even after failure
        if: always()
        run: |
          if [ -f .workflow-local/runtime-cloud/receipt.json ]; then
            echo '### Synthetic real runtime receipt' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat .workflow-local/runtime-cloud/receipt.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'RUNTIME_RECEIPT_MISSING: reconcile before any further attempt.' >> "$GITHUB_STEP_SUMMARY"
          fi
