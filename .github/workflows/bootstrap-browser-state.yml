name: bootstrap-browser-state

on:
  workflow_dispatch:
    inputs:
      workspace_id:
        description: Workspace UUID for the Teaching browser state
        required: true
        type: string
      payload:
        description: One-time encrypted state envelope generated by the local bootstrap helper
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MINDX_BOOTSTRAP_PAYLOAD: ${{ inputs.payload }}
      MINDX_BOOTSTRAP_PRIVATE_KEY: ${{ secrets.MINDX_BOOTSTRAP_PRIVATE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BROWSER_STATE_ENCRYPTION_KEY: ${{ secrets.BROWSER_STATE_ENCRYPTION_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked runner
        run: uv sync --locked --project apps/browser-runner

      - name: Decrypt state only on the runner
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MINDX_BOOTSTRAP_PRIVATE_KEY"
          test -n "$MINDX_BOOTSTRAP_PAYLOAD"
          umask 077
          printf '%s' "$MINDX_BOOTSTRAP_PRIVATE_KEY" > "$RUNNER_TEMP/mindx-bootstrap-private.pem"
          printf '%s' "$MINDX_BOOTSTRAP_PAYLOAD" | base64 --decode > "$RUNNER_TEMP/mindx-bootstrap-envelope.json"
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const temp = process.env.RUNNER_TEMP;
          const envelope = JSON.parse(
            fs.readFileSync(path.join(temp, "mindx-bootstrap-envelope.json"), "utf8"),
          );
          if (envelope.version !== 1) throw new Error("BOOTSTRAP_PAYLOAD_INVALID");

          const privateKey = fs.readFileSync(
            path.join(temp, "mindx-bootstrap-private.pem"),
            "utf8",
          );
          const aesKey = crypto.privateDecrypt(
            {
              key: privateKey,
              oaepHash: "sha256",
              padding: crypto.constants.RSA_PKCS1_OAEP_PADDING,
            },
            Buffer.from(envelope.key, "base64"),
          );
          const decipher = crypto.createDecipheriv(
            "aes-256-gcm",
            aesKey,
            Buffer.from(envelope.iv, "base64"),
          );
          decipher.setAuthTag(Buffer.from(envelope.tag, "base64"));
          const state = Buffer.concat([
            decipher.update(Buffer.from(envelope.ciphertext, "base64")),
            decipher.final(),
          ]);
          if (state.length === 0 || state.length > 2 * 1024 * 1024) {
            throw new Error("STORAGE_STATE_INVALID");
          }
          fs.writeFileSync(
            path.join(temp, "mindx-teaching-state-refresh.json"),
            state,
            { mode: 0o600 },
          );
          NODE

      - name: Upload encrypted Teaching state
        run: >-
          uv run --project apps/browser-runner mindx-runner bootstrap-browser-state
          --site teaching
          --workspace-id "${{ inputs.workspace_id }}"
          --state-path "$RUNNER_TEMP/mindx-teaching-state-refresh.json"
          --key-version 1

      - name: Remove temporary state and transport key
        if: always()
        shell: bash
        run: >-
          rm -f "$RUNNER_TEMP/mindx-teaching-state-refresh.json"
          "$RUNNER_TEMP/mindx-bootstrap-envelope.json"
          "$RUNNER_TEMP/mindx-bootstrap-private.pem"
