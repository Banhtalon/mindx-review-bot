name: QQ workflow v9 task
description: Evidence-gated task with manual actor routing.
title: "[v9] "
labels: [needs-plan]
body:
  - type: textarea
    id: outcome
    attributes: { label: Owner-visible outcome }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: In scope and explicitly out of scope }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Criteria to freeze before implementation }
    validations: { required: true }
  - type: dropdown
    id: risk
    attributes: { label: Declared risk, options: [GREEN, YELLOW, RED] }
    validations: { required: true }
  - type: dropdown
    id: complexity
    attributes: { label: Complexity independent of risk, options: [S, M, L, XL] }
    validations: { required: true }
  - type: input
    id: manifest
    attributes: { label: Frozen manifest path and anchored SHA-256, placeholder: pending before READY }
    validations: { required: true }
  - type: textarea
    id: control
    attributes:
      label: v9 control record
      value: |
        task_id: TASK-REPLACE
        state: INTAKE
        scope_revision: 1
        approved_base_sha: pending
        effective_risk: GREEN
        complexity: S
        attempt_number: 0
        routing_mode: MANUAL
    validations: { required: true }
  - type: textarea
    id: owner_action
    attributes: { label: Owner action or blocker, description: Never request secrets or technical review. }
    validations: { required: false }
