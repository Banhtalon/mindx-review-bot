name: Công việc cho AI
description: Nêu kết quả cần có; AI tự điều tra và kiểm tra kỹ thuật.
title: "[Công việc] "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Bạn muốn đạt kết quả gì?
      description: Mô tả bằng ngôn ngữ thường dùng; không cần biết mã hoặc công nghệ.
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Khi nào bạn thấy công việc đã xong?
      description: Ví dụ thao tác và kết quả bạn muốn thấy.
    validations: { required: false }
  - type: textarea
    id: limits
    attributes:
      label: Giới hạn cần giữ
      description: Dữ liệu, chi phí hoặc hành vi không được thay đổi. Không nhập mật khẩu hoặc khóa.
    validations: { required: false }
