[project]
name = "mindx-browser-runner"
version = "0.1.0"
description = "Synthetic-only Browser Use runner for MindX Review Bot Spike 0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "browser-use==0.13.6",
  "cryptography>=50,<51",
  "pydantic>=2.12,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mindx-runner = "mindx_runner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mindx_runner"]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<0.13",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/fixtures"]
